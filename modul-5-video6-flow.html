<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PowerMatch · Modul 5 · Video 6 · Adversus · CV sendt-flowet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ============================================================
   POWERMATCH PRÆSENTATIONS-STANDARD v1.3
   Modul 5 · Video 6 · Adversus · CV sendt-flowet (ét slide)
   Bygget videre på modul4-video1-branchen.html (søsterdecket):
   samme slide-motor, samme farver, samme typografi, samme chrome.
   Tilføjelserne nedenfor er nye FIGURER, ikke et nyt designsprog.
   ============================================================ */
:root{
  --gul:#F8E965; --gul-soft:#FDF8D4; --gul-kant:#F0E4A0;
  --sort:#111213; --tekst:#26282B; --muted:#71757C;
  --border:#ECECE8; --flade:#F6F6F3; --bg:#FFFFFF;
  --linje:#C9C9C2;
  --ease:cubic-bezier(.22,1,.36,1);
  --mx:7vw;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{font-family:'Inter',-apple-system,Arial,sans-serif;color:var(--tekst);background:var(--bg);-webkit-font-smoothing:antialiased}
b{color:var(--sort)}
mark{
  background:linear-gradient(transparent 70%, var(--gul) 70%, var(--gul) 96%, transparent 96%);
  background-size:0% 100%;background-repeat:no-repeat;color:inherit;padding:0 .05em;
  transition:background-size .5s var(--ease) .95s;
}
.aktiv mark{background-size:100% 100%}

/* ---------- slide-skelet ---------- */
.slide{
  position:absolute;inset:0;visibility:hidden;opacity:0;transform:scale(.986);
  transition:opacity .45s var(--ease),transform .65s var(--ease),visibility 0s .45s;
  padding:13vh var(--mx) 11vh;overflow:hidden;
}
.slide.aktiv{visibility:visible;opacity:1;transform:none;transition:opacity .5s var(--ease),transform .7s var(--ease)}
.r{opacity:0;transform:translateY(14px);transition:opacity .55s var(--ease),transform .55s var(--ease)}
.aktiv .r{opacity:1;transform:none}
.aktiv .d1{transition-delay:.08s}.aktiv .d2{transition-delay:.16s}.aktiv .d3{transition-delay:.24s}
.aktiv .d4{transition-delay:.32s}.aktiv .d5{transition-delay:.4s}.aktiv .d6{transition-delay:.48s}
.lm{display:block;overflow:hidden}
.lm span{display:block;transform:translateY(112%);transition:transform .7s var(--ease)}
.aktiv .lm span{transform:none}
.aktiv .lm:nth-child(2) span{transition-delay:.08s}
.aktiv .lm:nth-child(3) span{transition-delay:.16s}
.z{position:relative;z-index:1}

/* ---------- typografi ---------- */
.kicker{display:flex;align-items:center;gap:14px;margin-bottom:26px}
.kicker .knr{font-size:15px;font-weight:900;color:var(--sort);font-variant-numeric:tabular-nums}
.kicker .krule{width:46px;height:2px;background:var(--gul)}
.kicker .ktxt{font-size:12px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
h1{font-size:clamp(46px,5.9vw,88px);font-weight:900;color:var(--sort);letter-spacing:-.033em;line-height:1.03}
h2{font-size:clamp(30px,3.2vw,48px);font-weight:900;color:var(--sort);letter-spacing:-.027em;line-height:1.07;max-width:26ch}
p.under{font-size:clamp(15px,1.35vw,19px);line-height:1.6;color:var(--muted);max-width:56ch}

/* spøgelsestal */
.ghost{
  position:absolute;right:-.05em;bottom:-.12em;z-index:0;pointer-events:none;user-select:none;
  font-size:64vh;font-weight:900;line-height:.8;letter-spacing:-.05em;
  color:transparent;-webkit-text-stroke:1.5px rgba(17,18,19,.09);
}
.fyld{display:flex;flex-direction:column;height:100%}
.vgruppe{margin:auto 0;display:flex;flex-direction:column}
.skub{margin-top:auto !important;padding-bottom:2vh}

/* ---------- tjekliste ---------- */
.tjekliste{margin-top:4vh;max-width:900px}
.tjekliste .trow{display:flex;align-items:baseline;gap:20px;border-top:1px solid var(--border);padding:22px 4px}
.tjekliste .trow:last-child{border-bottom:1px solid var(--border)}
.tjekliste .tdot{width:12px;height:12px;border-radius:50%;background:var(--gul);flex-shrink:0;position:relative;top:-2px}
.tjekliste .ttxt{font-size:clamp(15px,1.55vw,20px);font-weight:800;color:var(--sort)}
.tjekliste .ttxt span{color:var(--muted);font-weight:500}

/* ---------- proces-timeline (workflow) ---------- */
.tflow{position:relative;margin:auto 0}
.tflow .linje{position:absolute;left:31px;right:calc((100% - 104px)/5 - 31px);top:31px;height:2px;background:var(--sort)}
.tflow .stationer{display:grid;grid-template-columns:repeat(5,1fr);column-gap:26px}
.station{position:relative}
.station .boks{
  width:62px;height:62px;background:var(--gul);border-radius:12px;
  display:flex;align-items:center;justify-content:center;gap:3px;
  font-size:26px;font-weight:900;color:var(--sort);margin-bottom:24px;position:relative;z-index:1;
  box-shadow:0 0 0 8px var(--bg);
}
.station.slut .boks{background:var(--sort);color:var(--gul)}
.station h5{font-size:16px;font-weight:800;color:var(--sort);margin-bottom:7px;letter-spacing:-.01em}
.station p{font-size:13px;line-height:1.5;color:var(--muted);max-width:22ch}

/* ---------- gul effekt-slide ---------- */
.slide.gulflade{background:var(--gul)}
.gulflade .kicker .krule{background:var(--sort)}
.gulflade .kicker .ktxt,.gulflade .kicker .knr{color:var(--sort)}
.gulflade h2{max-width:none}
.gulflade p.under{color:rgba(17,18,19,.68)}

/* ---------- split ---------- */
.split{position:absolute;inset:0;display:grid;grid-template-columns:46% 54%}
.split .venstre{padding:13vh 3vw 11vh var(--mx);display:flex;flex-direction:column}
.split .hoejre{position:relative;overflow:hidden;border-left:1px solid var(--border);display:flex;align-items:center;justify-content:center}
.kaempe{
  position:relative;font-size:clamp(180px,17vw,300px);font-weight:900;letter-spacing:-.05em;
  line-height:1;color:var(--sort);font-variant-numeric:tabular-nums;
}
.kaempe i{position:absolute;left:-.05em;right:-.05em;bottom:.03em;height:.24em;background:var(--gul);z-index:-1}
.fakta-stak{display:flex;flex-direction:column}
.fakta-r{border-top:1px solid var(--border);padding:15px 0;font-size:15px;font-weight:700;color:var(--sort)}
.fakta-r:last-child{border-bottom:1px solid var(--border)}
.fakta-r span{color:var(--muted);font-weight:500}

/* ---------- hero + gab-graf + statlinje ---------- */
.hoejre.pro{flex-direction:column;align-items:stretch;justify-content:space-between;padding:13vh 7vw 11vh 4vw}
.pro-hero{text-align:center;padding-top:1vh}
.pro-hero .kaempe{display:inline-block}
.pro-hero .ptag{margin-top:20px;font-size:12px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.gab .gtitel{font-size:11px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:12px;max-width:70ch}
.gab svg{display:block;width:100%;height:auto}
.gab .glab{font-family:'Inter',Arial,sans-serif;font-size:10.5px;font-weight:800;letter-spacing:.14em;fill:var(--muted)}
.gab .gval{font-family:'Inter',Arial,sans-serif;font-size:14.5px;font-weight:900;letter-spacing:-.02em;fill:var(--sort);font-variant-numeric:tabular-nums}
.gab .gval.hvid{fill:#fff}
.pro-stats{display:grid;grid-template-columns:1fr 1.2fr;column-gap:30px}
.pro-stats.en{grid-template-columns:1fr}
.pro-stats.tre{grid-template-columns:repeat(3,1fr)}
.pro-stats .pcell{border-left:1px solid var(--border);padding-left:26px}
.pro-stats .pcell:first-child{border-left:none;padding-left:0}
.pro-stats .pval{font-size:clamp(24px,2.1vw,34px);font-weight:900;color:var(--sort);letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1}
.pro-stats .plab{margin-top:8px;font-size:10.5px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);line-height:1.55}
.pro-stats .pnote{margin-top:8px;font-size:10.5px;font-weight:600;color:var(--muted);opacity:.85}
.pro-kilde{margin-top:18px;font-size:10px;font-weight:600;letter-spacing:.05em;color:var(--muted);opacity:.75;line-height:1.5}

p.under.bundfast{margin-top:auto !important;border-top:1px solid var(--border);padding-top:18px;padding-bottom:1vh;max-width:none}

/* ---------- mørk flade ---------- */
.slide.moerk{background:var(--sort)}
.moerk .kicker .ktxt{color:rgba(255,255,255,.5)}
.moerk .kicker .knr{color:#fff}
.moerk h2{color:#fff}
.moerk p.under{color:rgba(255,255,255,.6)}
.moerk .ghost{-webkit-text-stroke:1.5px rgba(255,255,255,.1)}
.moerk .tjekliste .trow{border-color:rgba(255,255,255,.16)}
.moerk .tjekliste .ttxt{color:#fff}
.moerk .tjekliste .ttxt span{color:rgba(255,255,255,.6)}
.moerk .dtitel{color:rgba(255,255,255,.5)}

/* duo */
.duo{display:grid;grid-template-columns:1fr 1fr;column-gap:56px}
.duo .dtitel{font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);padding-bottom:12px}

/* KABOOM-titel (gul fuldflade) */
.titelgul h1{line-height:.98;letter-spacing:-.04em;text-transform:uppercase}
.titelgul .boxline{display:inline-block;background:var(--sort);color:var(--gul);padding:.02em .14em;border-radius:10px}
.titelgul .ghost{-webkit-text-stroke:2px rgba(17,18,19,.14);font-size:88vh;bottom:-14vh;right:-2vw}

/* chips */
.kstrip{display:flex;gap:9px;flex-wrap:wrap}
.kchip{display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:100px;padding:7px 13px;
  font-size:10px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.kchip i{font-style:normal;font-size:13px;font-weight:900;line-height:1}
.kchip.ja{color:var(--sort);border-color:#DCDCD5}
.kchip.gul{background:var(--gul);border-color:var(--gul-kant);color:var(--sort)}
.kchip.fuld{background:var(--sort);border-color:var(--sort);color:#fff}
.kchip.kant{color:var(--sort);border-color:var(--linje)}
.kchip.stiplet{border-style:dashed;border-color:var(--linje)}
.kstrip.stor .kchip{font-size:11.5px;padding:11px 17px;letter-spacing:.1em}
.gulflade .kchip{border-color:rgba(17,18,19,.32);color:var(--sort)}
.moerk .kchip{border-color:rgba(255,255,255,.24);color:rgba(255,255,255,.72)}

/* ============================================================
   MODUL 4 · NYE FIGUR-KOMPONENTER (samme tokens, ingen nye farver)
   ============================================================ */

/* ikoner: ét stregsprog hele vejen igennem modulet */
.ik{width:22px;height:22px;flex-shrink:0;stroke:currentColor;stroke-width:1.7;fill:none;
  stroke-linecap:round;stroke-linejoin:round}
.ik.stor{width:30px;height:30px;stroke-width:1.6}
.ik.mini{width:15px;height:15px;stroke-width:1.9}
.ik.xl{width:44px;height:44px;stroke-width:1.4}
.station .boks .ik{width:29px;height:29px}
.station .boks.duoik .ik{width:21px;height:21px}
.kchip .ik{width:14px;height:14px;stroke-width:2}

/* fakta-rækker med nummer og ikon (fra Modul 3 · Video 3) */
.frows{width:100%;max-width:900px}
.frow{display:flex;align-items:center;gap:16px;border-top:1px solid var(--border);padding:15px 4px}
.frow:last-child{border-bottom:1px solid var(--border)}
.frow .fnr{font-size:13px;font-weight:900;color:var(--sort);width:26px;height:26px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.frow .ft{font-size:clamp(14.5px,1.45vw,19px);font-weight:800;color:var(--sort);letter-spacing:-.01em}
.frow .ft span{color:var(--muted);font-weight:500}
.frow .fnote{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:10px;font-weight:800;
  letter-spacing:.13em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.frow.hero .fnr{background:var(--gul);border-radius:8px}
.frow.svag .ft,.frow.svag .fnr,.frow.svag .ik{color:var(--muted)}
.moerk .frow{border-color:rgba(255,255,255,.16)}
.moerk .frow .ft{color:#fff}

/* formel-linje (fra Video 2 · 10 spørgsmål) */
.frik{display:flex;align-items:flex-end;gap:clamp(10px,1.2vw,20px);flex-wrap:nowrap;white-space:nowrap}
.frik .led{position:relative}
.frik .val{font-size:clamp(19px,1.9vw,30px);font-weight:900;color:var(--sort);letter-spacing:-.03em}
.frik .op{font-size:clamp(18px,1.9vw,28px);font-weight:800;color:var(--linje)}
.frik .val.ringet{background:var(--gul);border-radius:10px;padding:.06em .2em}
.frik .lab{position:absolute;left:2px;top:100%;margin-top:11px;font-size:9.5px;font-weight:800;
  letter-spacing:.14em;color:var(--muted);text-transform:uppercase;white-space:nowrap}

/* kæmpe tal / kæmpe ord */
.heroTal{display:flex;align-items:baseline;gap:22px}
.heroTal .t{position:relative;font-size:clamp(64px,7.6vw,132px);font-weight:900;color:var(--sort);
  letter-spacing:-.05em;line-height:1;font-variant-numeric:tabular-nums}
.heroTal .t i{position:absolute;left:-.04em;right:-.04em;bottom:.05em;height:.22em;background:var(--gul);z-index:-1}
.heroTal .tl{font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);
  max-width:20ch;line-height:1.55}
.heroTal.ord{flex-direction:column;align-items:flex-start;gap:10px}
.heroTal.ord .t{font-size:clamp(24px,2.5vw,38px);letter-spacing:-.03em;line-height:1.08;max-width:11ch}

/* svar-kort: replikken man husker */
.svarkort{background:var(--gul);border-radius:16px;padding:18px 22px}
.svarkort .sv{font-size:clamp(19px,2vw,30px);font-weight:900;color:var(--sort);letter-spacing:-.03em;line-height:1.1}
.svarkort .svu{margin-top:8px;font-size:11px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:rgba(17,18,19,.6)}

/* gul ankerflade i bunden af et slide */
.gulbaand{margin-top:auto;background:var(--gul);padding:18px var(--mx);
  margin-left:calc(-1 * var(--mx));margin-right:calc(-1 * var(--mx))}
.gulbaand .gb{font-size:clamp(19px,2.05vw,30px);font-weight:900;color:var(--sort);letter-spacing:-.022em;line-height:1.14}
/* slutlinje: samme rolle som en gul ankerflade, men uden gul, når gul er brugt i figuren */
.slutlinje{margin-top:auto;border-top:1px solid var(--border);padding-top:15px;
  font-size:clamp(17px,1.75vw,25px);font-weight:900;color:var(--sort);letter-spacing:-.022em;line-height:1.15}
.notelinje{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.03em;line-height:1.5}
.advarsel{display:flex;gap:11px;align-items:flex-start;border-left:3px solid var(--linje);padding-left:12px;
  font-size:11.5px;font-weight:700;color:var(--muted);line-height:1.5;max-width:100ch}
.advarsel .ik{width:15px;height:15px;margin-top:1px}

/* synligt tom, stiplet plads: tal der mangler, og som IKKE må gættes */
.tomplads{display:inline-flex;align-items:center;gap:10px;border:1.5px dashed var(--linje);border-radius:100px;
  padding:7px 15px;font-size:10px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.tomplads b{color:var(--sort);letter-spacing:.24em}
.tomboks{border:1.5px dashed var(--linje);border-radius:14px;padding:12px 15px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.tomboks .tblab{font-size:9.5px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);max-width:38ch;line-height:1.5}

/* kort */
.dkort{border:1px solid var(--border);border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.dkort.svag{background:var(--flade)}
.dkort.tung{border-color:var(--linje);background:var(--flade)}
.dkort .dk-titel{display:flex;align-items:center;gap:10px;font-size:12px;font-weight:900;letter-spacing:.02em;color:var(--sort)}
.dkort .dk-txt{font-size:13px;font-weight:600;color:var(--muted);line-height:1.5}
.dkort.svag .dk-titel{color:var(--muted)}
.gulflade .dkort{border-color:rgba(17,18,19,.3)}
.gulflade .dkort .dk-txt{color:rgba(17,18,19,.66)}
.matchboks{background:var(--sort);color:var(--gul);border-radius:16px;padding:16px 24px;
  font-size:clamp(19px,2.2vw,32px);font-weight:900;letter-spacing:-.02em;align-self:center}

/* replik-rækker */
.rep{display:flex;align-items:center;gap:12px;border-top:1px solid var(--border);padding:12px 2px}
.rep:last-of-type{border-bottom:1px solid var(--border)}
.rep .rt{font-size:14px;font-weight:700;color:var(--sort);line-height:1.4}
.rep .ik{color:var(--muted)}
.rep.svag .rt{color:var(--muted)}
.rep .pp{margin-left:auto}

/* mørkt bånd med brud */
.moerkbaand{display:flex;align-items:center;gap:16px;background:var(--sort);border-radius:14px;padding:15px 20px;color:#fff}
.moerkbaand .mb{font-size:14.5px;font-weight:800;letter-spacing:-.01em}
.moerkbaand .ik{color:var(--gul)}

/* figurer */
.figur{display:block;width:100%;height:auto}
.figurmax{margin:0 auto}
svg text{font-family:'Inter',Arial,sans-serif}
.svgtxt{font-size:12px;font-weight:800;fill:var(--sort)}
.svgstor{font-size:19px;font-weight:900;fill:var(--sort);letter-spacing:-.02em}
.svgmut{font-size:11px;font-weight:700;fill:var(--muted)}
.svgcap{font-size:10px;font-weight:800;letter-spacing:.13em;fill:var(--muted)}
.svgval{font-size:12px;font-weight:900;fill:var(--sort);font-variant-numeric:tabular-nums}
.svgvalhvid{font-size:12px;font-weight:900;fill:#fff;font-variant-numeric:tabular-nums}
.gtitel{font-size:11px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);max-width:80ch}

/* fagkæden: MASTERFIGUR. Genbruges i Video 4 ved at sætte ÉN klasse på .kaede:
   .fremhaev-jordbeton | .fremhaev-murer | .fremhaev-toemrer | .fremhaev-elvvs | .fremhaev-maler
   Uden fremhæv-klasse står alle fem stationer lige stærkt (dette slide). */
.kaede .boks{background:var(--sort);border:none;color:var(--gul)}
.kaede .station{transition:opacity .45s var(--ease)}
.kaede .boks{transition:transform .45s var(--ease)}
.kaede[class*="fremhaev-"] .station{opacity:.34}
.kaede.fremhaev-jordbeton .st-jordbeton,
.kaede.fremhaev-murer .st-murer,
.kaede.fremhaev-toemrer .st-toemrer,
.kaede.fremhaev-elvvs .st-elvvs,
.kaede.fremhaev-maler .st-maler{opacity:1}
.kaede.fremhaev-jordbeton .st-jordbeton .boks,
.kaede.fremhaev-murer .st-murer .boks,
.kaede.fremhaev-toemrer .st-toemrer .boks,
.kaede.fremhaev-elvvs .st-elvvs .boks,
.kaede.fremhaev-maler .st-maler .boks{background:var(--gul);color:var(--sort);transform:scale(1.1)}

/* tflow-varianter: gul er anker, så kun ÉT led må være gult */
.tflow.neutral .boks{background:var(--flade);border:1px solid var(--linje);color:var(--sort)}
.tflow.neutral .station.staerk .boks{background:var(--gul);border-color:var(--gul);
  transform:scale(1.1);box-shadow:0 0 0 8px var(--bg),0 0 0 11px var(--gul-soft)}
.tflow .stationer.fem-tal{grid-template-columns:repeat(5,1fr)}
.pilned{width:2px;height:22px;background:var(--linje);margin-left:31px;position:relative}
.pilned::after{content:"";position:absolute;bottom:0;left:50%;transform:translateX(-50%);
  border:5px solid transparent;border-top-color:var(--linje)}

/* 12-måneders bånd: SAMME skala og samme nedtoning som årshjulet på slide 26 */
.aarbaand{display:flex;align-items:center;gap:14px}
.aarbaand .abnavn{width:112px;flex-shrink:0;text-align:right;font-size:10px;font-weight:800;
  letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
.aarbaand .abnavn.gulchip{background:var(--gul);color:var(--sort);border-radius:100px;padding:5px 0;
  text-align:center;width:112px}
.aarbaand .abfelter{flex:1;display:grid;grid-template-columns:repeat(12,1fr);gap:3px}
.aarbaand .m{height:24px;border-radius:4px;background:var(--sort);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:900;letter-spacing:.02em}
.aarbaand .m.ned{background:#DDDDD6;color:var(--muted)}

/* årshjul */
.hjulwrap{display:flex;justify-content:center;align-items:center}
.hjul{display:block;width:100%;max-width:500px;height:auto}
.hjul .mnd{font-size:14px;font-weight:800;letter-spacing:.05em;fill:var(--muted)}
.hjul .banenavn{font-size:13px;font-weight:900;letter-spacing:.16em;paint-order:stroke;stroke-width:4px;stroke-linejoin:round}
.hjul .midt{font-size:14.5px;font-weight:800;fill:var(--sort)}

/* ---------- chrome ---------- */
.meta-tl,.meta-tr{position:fixed;top:30px;z-index:97;font-size:11px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.meta-tl{left:var(--mx)} .meta-tl b{color:var(--sort)}
.meta-tr{right:var(--mx)}
.moerk-chrome .meta-tl,.moerk-chrome .meta-tr{color:rgba(255,255,255,.55)}
.moerk-chrome .meta-tl b{color:#fff}
.gul-chrome .meta-tl,.gul-chrome .meta-tr{color:rgba(17,18,19,.6)}
.gul-chrome .meta-tl b{color:var(--sort)}
.folio{
  position:fixed;left:0;right:0;bottom:0;z-index:97;height:58px;
  display:flex;align-items:center;gap:16px;padding:0 var(--mx);
  border-top:1px solid var(--border);font-size:11px;font-weight:800;letter-spacing:.18em;
  text-transform:uppercase;color:var(--muted);background:var(--bg);
}
.folio .brand{color:var(--sort);display:flex;align-items:center;gap:10px}
.folio .brand img{width:22px;height:22px}
.folio .nr{margin-left:auto;font-size:15px;font-weight:900;color:var(--sort);letter-spacing:.06em;font-variant-numeric:tabular-nums}
.folio .nr span{color:var(--linje)}
.moerk-chrome .folio{background:var(--sort);border-color:rgba(255,255,255,.14);color:rgba(255,255,255,.5)}
.moerk-chrome .folio .brand,.moerk-chrome .folio .nr{color:#fff}
.moerk-chrome .folio .nr span{color:rgba(255,255,255,.35)}
.gul-chrome .folio{background:var(--gul);border-color:rgba(17,18,19,.18);color:rgba(17,18,19,.6)}
.gul-chrome .folio .brand,.gul-chrome .folio .nr{color:var(--sort)}
.progress{position:fixed;bottom:56px;left:0;height:3px;background:var(--gul);width:0;z-index:98;transition:width .4s var(--ease)}
.moerk-chrome .progress,.gul-chrome .progress{background:var(--sort)}
.pilzone{position:fixed;top:0;bottom:58px;width:12%;z-index:90;cursor:pointer}
.pilzone.v{left:0}.pilzone.h{right:0}

/* ---------- lav skærm (fx 1366x768): samme udtryk, strammere lodret rytme ---------- */
@media (max-height:820px){
  .slide{padding:9vh var(--mx) 8vh}
  .split .venstre{padding:9vh 3vw 8vh var(--mx)}
  .hoejre.pro{padding:9vh 7vw 8vh 4vw}
  .kicker{margin-bottom:20px}
  .tjekliste{margin-top:2.6vh}
  .tjekliste .trow{padding:15px 4px}
  .frow{padding:11px 4px}
  .rep{padding:9px 2px}
  p.under{line-height:1.5}
  .skub{padding-bottom:1vh}
  .station .boks{margin-bottom:18px}
  .hjul{max-width:462px}
  .gulbaand{padding:14px var(--mx)}
  .heroTal .t{font-size:clamp(56px,6.6vw,110px)}
}
@media (max-width:1500px){
  .frik{gap:clamp(8px,1vw,16px)}
  .frik .val{font-size:clamp(17px,1.7vw,28px)}
  .frik .op{font-size:clamp(16px,1.7vw,26px)}
  .frik .lab{font-size:9px;letter-spacing:.1em}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{
  html,body{overflow:visible}
  .slide{position:relative;visibility:visible;opacity:1;transform:none;page-break-after:always;height:100vh}
  .progress,.pilzone,.folio,.meta-tl,.meta-tr{display:none}
  .r,.lm span{opacity:1;transform:none}
  mark{background-size:100% 100%}
}

/* v2 typografi-vagt: forhindrer horeunger (kort sidste linje) og skæve overskrifts-brud */
h1,h2{text-wrap:balance}
p,h5,.ttxt,.mtxt,.rtxt,.fakta-r,.station p,.ft,.dk-txt,.rt,.under,.notelinje,.gtitel{text-wrap:pretty}

/* ============================================================
   MODUL 4 · VIDEO 2 · NYE FIGUR-KOMPONENTER
   Alt herunder er tilføjelser til v1.3. Ingen nye farver, ingen
   ny slide-motor. De fire nye greb er:
   1) .rkort  · replik-kortene (fire slides, samme greb hver gang)
   2) .duo.spejl · modsætningen replik for replik (S8 og S20)
   3) .brud / .brudtxt · den brudte linje (S9, S14, S22)
   4) .panel · kontrolcirklens to felter (S22)
   ============================================================ */

/* ---- REPLIK-KORT: deckets signaturgreb ------------------------
   Skal se ens ud på S6, S9, S13, S16, S17 og S11/S22, så en sælger
   kan tage et telefon-screenshot af hvilket som helst af dem. ---- */
.telefonkicker{display:flex;align-items:center;gap:13px;font-size:11.5px;font-weight:800;
  letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
.telefonkicker .ik{width:18px;height:18px;color:var(--sort);stroke-width:1.7}
.telefonkicker::after{content:"";flex:1;height:1px;background:var(--border)}

.kortnet{display:grid;gap:20px}
.kortnet.tre{grid-template-columns:repeat(3,1fr)}
.kortnet.to{grid-template-columns:1fr 1fr}
.kortnet>.kw{display:flex}
.kortnet .kw>.rkort{flex:1}
.kortnet .bred{grid-column:1 / -1}
/* kortene fylder den plads der er: nettet strækker sig, og rækkerne er lige høje */
.kortnet.fyldud{flex:1;grid-auto-rows:1fr}
/* når kortet strækkes, står replikken midt i kortet, og den sættes større:
   det er de to slides en sælger tager et telefon-screenshot af. */
.kortnet.fyldud .rkort{justify-content:center}
.kortnet.fyldud .rkort .rk{font-size:clamp(19px,2.08vw,31px);line-height:1.16}
.kortnet.fyldud .rkort .rq{font-size:42px;height:24px}

.rkort{position:relative;background:#fff;border:1px solid var(--border);border-radius:18px;
  padding:19px 22px 21px;display:flex;flex-direction:column;gap:9px;
  box-shadow:0 14px 28px -24px rgba(17,18,19,.34)}
.rkort .rq{display:block;height:20px;font-size:36px;font-weight:900;line-height:.86;
  color:var(--gul);letter-spacing:-.04em}
.rkort .rk{font-size:clamp(16.5px,1.68vw,24px);font-weight:800;color:var(--sort);
  letter-spacing:-.024em;line-height:1.19}
.rkort .rmark{position:absolute;right:17px;top:15px;display:flex;align-items:center;gap:9px;color:var(--muted)}
.rkort.graa .rq{color:var(--linje)}
.rkort.gul{background:var(--gul);border-color:var(--gul-kant);box-shadow:none}
.rkort.gul .rq{color:rgba(17,18,19,.42)}
.rkort.stor{padding:26px 28px 28px;gap:12px}
.rkort.stor .rq{font-size:44px;height:26px}
.rkort.stor .rk{font-size:clamp(18px,1.98vw,30px);line-height:1.15}
.moerk .rkort{background:var(--gul);border-color:var(--gul);box-shadow:none}
.moerk .rkort .rq{color:rgba(17,18,19,.42)}
.moerk .rkort .rk{color:var(--sort)}
/* kortene ligger let forskudt, som kort man har lagt ud på bordet.
   Rotationen sidder på .rkort, ikke på .r, fordi .aktiv .r nulstiller transform. */
.skaev1{transform:rotate(-.55deg)}.skaev2{transform:rotate(.45deg)}
.skaev3{transform:rotate(.32deg)}.skaev4{transform:rotate(-.38deg)}
.indad-v{transform:rotate(-1.25deg)}.indad-h{transform:rotate(1.25deg)}

/* ---- svarhero: den fremhævede konklusion nederst i en .duo ---- */
.svarhero{background:var(--gul);border-radius:16px;padding:15px 19px;display:flex;align-items:center;gap:15px}
.svarhero .shv{font-size:clamp(17px,1.9vw,28px);font-weight:900;color:var(--sort);letter-spacing:-.03em;line-height:1.1}
.svarhero .ik{color:var(--sort);flex-shrink:0}

/* ---- recap-linje. .n = sort/hvid prik, når gul er brugt i figuren ---- */
.recap{display:flex;align-items:flex-start;gap:14px;border-top:1px solid var(--border);padding-top:14px}
.recap .rdot{width:11px;height:11px;border-radius:50%;background:var(--gul);flex-shrink:0;margin-top:5px}
.recap.n .rdot{background:var(--sort)}
.recap .rtx{font-size:clamp(14px,1.42vw,19px);font-weight:800;color:var(--sort);letter-spacing:-.012em;line-height:1.45}
.moerk .recap{border-color:rgba(255,255,255,.16)}
.moerk .recap .rtx{color:#fff}
.moerk .recap.n .rdot{background:#fff}

/* ---- brudt linje: en streg der knækker midt over ---- */
.brud{display:flex;align-items:center;gap:14px}
.brud .bs{flex:1;height:1px;background:var(--linje)}
.brud .bz{color:var(--gul);flex-shrink:0}
.brud .bi{color:var(--muted);flex-shrink:0}
.brudtxt{margin-top:15px;font-size:clamp(17px,1.8vw,26px);font-weight:900;color:var(--sort);
  letter-spacing:-.026em;line-height:1.15}
.moerk .brud .bs{background:rgba(255,255,255,.3)}
.moerk .brudtxt{color:#fff}
.moerk .brud .bi{color:rgba(255,255,255,.55)}

/* ---- spejl-duo: SAMME opbygning i begge halvdele af decket.
   S8 (sælger mod rådgiver) og S20 (2 min mod 5-10 min) deler den her
   klasse, så de to modsætninger kan lægges op mod hinanden. ---- */
.duo.spejl{column-gap:54px;align-items:stretch}
.duo.spejl .dside{display:flex;flex-direction:column}
.duo.spejl .dtop{display:flex;align-items:center;gap:18px;margin:4px 0 10px}
.duo.spejl .dbund{margin-top:auto;padding-top:16px}
.duo.spejl .dside.svag .rt{color:var(--muted)}
.duo.spejl.strk{flex:1}
.laegpaa{display:flex;align-items:center;gap:11px;font-size:10.5px;font-weight:800;
  letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

/* ---- panel: kontrolcirklens to felter ---- */
.panel{border-radius:20px;padding:21px 24px 6px;display:flex;flex-direction:column;gap:12px}
.panel.gul{background:var(--gul)}
.panel.gul .ptitel{color:rgba(17,18,19,.6)}
.panel.gul .tjekliste{margin-top:0}
.panel.gul .tjekliste .trow{border-color:rgba(17,18,19,.22);padding:12px 0}
.panel.gul .tjekliste .tdot{background:var(--sort)}
.panel.gul .tjekliste .ttxt{color:var(--sort)}
.panel.stille{border:1px solid rgba(255,255,255,.16);padding-bottom:18px}
.ptitel{display:flex;align-items:center;gap:11px;font-size:11.5px;font-weight:800;
  letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.ptitel .ik{flex-shrink:0}
.moerk .panel.stille .ptitel{color:rgba(255,255,255,.55)}
.moerk .panel.stille .frow{border-color:rgba(255,255,255,.16)}

/* ---- tre-fase bånd: ét opkald fra venstre mod højre ---- */
.faserow{display:flex;align-items:center;gap:16px}
.faseband{display:flex;align-items:stretch;gap:4px;flex:1}
.fseg{border-radius:7px;padding:12px 15px;display:flex;align-items:center;line-height:1.3;
  font-size:11px;font-weight:800;letter-spacing:.11em;text-transform:uppercase}
.fseg.et{flex:2;background:var(--sort);color:#fff}
.fseg.to{flex:1;background:var(--flade);border:1px solid var(--linje);color:var(--sort)}
.fseg.tre{flex:1;background:transparent;border:1px dashed var(--linje);color:var(--muted)}

/* ---- små rettelser i arvet CSS, som Video 2 har brug for ---- */
/* slut-leddet i en neutral tflow skal kunne være sort (gul er brugt i figuren) */
.tflow.neutral .station.slut .boks{background:var(--sort);border-color:var(--sort);color:var(--gul);
  transform:scale(1.1);box-shadow:0 0 0 8px var(--bg)}
.moerk .heroTal .t{color:#fff}
.moerk .heroTal .tl{color:rgba(255,255,255,.58)}
.moerk .notelinje{color:rgba(255,255,255,.55)}
.moerk .dkort{border-color:rgba(255,255,255,.18)}
.moerk .dkort .dk-titel{color:#fff}
.moerk .dkort .dk-txt{color:rgba(255,255,255,.6)}
.midtret{display:flex;justify-content:center}
.svgtxthvid{font-size:12px;font-weight:800;fill:rgba(255,255,255,.82)}
.svgcaphvid{font-size:10px;font-weight:800;letter-spacing:.13em;fill:rgba(255,255,255,.5)}
.ringnavn{font-size:15px;font-weight:900;letter-spacing:.16em;paint-order:stroke;
  stroke-width:5px;stroke-linejoin:round}

/* ============================================================
   DE SEKS KASKADE-FÆLDER I GRUNDLAGET v1.3, lukket samlet her, så alle
   fire decks i Modul 4 står på samme grundlag og ingen af dem kan arve
   en usynlighedsfejl videre. Reglerne står ordret som i Video 1/Video 4:
   A) en fill-erklæring i en KLASSE på et SVG-tekstelement vinder over
      fill="#fff" som ATTRIBUT → hvid eller lys tekst bliver usynlig på
      mørk flade. Hvid tekst i SVG sættes derfor altid med
      style="fill:#fff" inline i dette deck.
   B) .gulflade .kchip står efter .kchip.fuld → sort tekst på sort pille.
   C) .moerk .kchip står efter .kchip.gul → lys grå tekst på gul pille.
   D) .gulbaand .kchip står efter .kchip.fuld → samme som B. Fundet i V4.
   E) .tik er scopet som ".tjekliste .tik", så et flueben brugt UDEN FOR
      en .tjekliste faldt tilbage til 300x150 og fill:black og kunne fylde
      det halve slide. Her får .tik samme regel uden scope. Fundet i V4.
   F) et ikon skaleret over 24 px får sin stregbredde ganget op og bliver
      en klat. .ik.stor (30 px), .ik.xl (44 px) og ikoner i en station-boks
      (29 px) får stregbredden divideret med skalaen. :not(.duoik) er
      nødvendig, fordi dobbeltikoner ellers bliver for tynde.
   ============================================================ */
.gulflade .kchip.fuld{background:var(--sort);border-color:var(--sort);color:#fff}
.moerk .kchip.gul{background:var(--gul);border-color:var(--gul);color:var(--sort)}
.moerk .kchip.gul .ik{color:var(--sort)}
.gulbaand .kchip{border-color:rgba(17,18,19,.32);color:var(--sort)}
.gulbaand .kchip .ik{color:var(--sort)}
.gulbaand .kchip.fuld{background:var(--sort);border-color:var(--sort);color:var(--gul)}
.gulbaand .kchip.fuld .ik{color:var(--gul)}
.tik{width:17px;height:17px;flex-shrink:0;color:var(--sort);
  stroke:currentColor;stroke-width:2.3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.ik.stor{stroke-width:1.35}
.ik.xl{stroke-width:1.1}
.station .boks:not(.duoik) .ik{stroke-width:1.4}

@media (max-height:820px){
  .rkort{padding:15px 18px 17px;gap:7px}
  .rkort .rq{font-size:30px;height:17px}
  .rkort.stor{padding:20px 22px 22px}
  .rkort.stor .rq{font-size:36px;height:21px}
  .kortnet{gap:15px}
  .svarhero{padding:12px 16px}
  .panel{padding:16px 19px 4px}
  .fseg{padding:9px 13px}
  .duo.spejl .dtop{margin:2px 0 6px}
  .brudtxt{margin-top:12px}
  .recap{padding-top:11px}
  .telefonkicker{letter-spacing:.18em}
}
</style>

<script>
const slides=[...document.querySelectorAll('.slide')];
let i=Math.max(0,Math.min(slides.length-1,(parseInt(location.hash.slice(1))||1)-1));
function pad(n){return String(n).padStart(2,'0')}
function vis(n){
  slides.forEach(s=>s.classList.remove('aktiv'));
  i=Math.max(0,Math.min(slides.length-1,n));
  slides[i].classList.add('aktiv');
  document.getElementById('taeller').innerHTML=pad(i+1)+' <span>/ '+pad(slides.length)+'</span>';
  document.getElementById('progress').style.width=((i+1)/slides.length*100)+'%';
  document.getElementById('folioSektion').textContent=slides[i].dataset.sektion||'';
  document.body.classList.toggle('moerk-chrome',slides[i].classList.contains('moerk'));
  document.body.classList.toggle('gul-chrome',slides[i].classList.contains('gulflade'));
  history.replaceState(null,'','#'+(i+1));
}
function gaa(d){vis(i+d)}
addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown','PageDown',' '].includes(e.key)){e.preventDefault();gaa(1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();gaa(-1)}
  if(e.key==='Home')vis(0); if(e.key==='End')vis(slides.length-1);
  if(e.key==='f'||e.key==='F'){if(!document.fullscreenElement)document.documentElement.requestFullscreen();else document.exitFullscreen()}
});
let tx=null;
addEventListener('touchstart',e=>tx=e.touches[0].clientX);
addEventListener('touchend',e=>{if(tx===null)return;const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>50)gaa(dx<0?1:-1);tx=null});
vis(i);
</script>

<!-- ============================================================================
     KAPITELNAVIGATION v1.0 · BYTE-IDENTISK BLOK
     Denne blok står ORDRET ENS i alle fem decks i Modul 4 og Modul 5. Skal den
     rettes, rettes den ét sted og kopieres byte for byte til de fire andre —
     præcis som kaskade-rettelsesblokken i grundlaget v1.3. Blokken indsættes
     nederst i body, efter deckets egen slide-motor, og den rører ikke ét
     eksisterende element: den læser data-sektion fra slidene og bygger selv
     både kapitellisten og fremdriftsindikatoren ind i DOM'en. Derfor kan den
     lægges ind i et deck uden at der ændres en eneste anden linje.

     HVAD DEN GØR
     1) KAPITELLISTE. Tasten K (eller M) åbner en liste over deckets kapitler
        med slidenumre. Klik eller taltast 1-9 hopper direkte. Pil op/ned
        flytter markeringen, Enter åbner, Escape lukker. Listen er LUKKET som
        udgangspunkt (display:none), så den kan ikke komme med på et
        screenshot og kan ikke forstyrre en optagelse. Mens den er åben,
        spiser den piletasterne, så man ikke kommer til at bladre bagved.
     2) KAPITLERNE ER BLOKKENE. De udledes af data-sektion på hvert slide,
        altså præcis det navn der står i kicker-linjen på slidet. Navigationen
        og indholdet kan derfor ikke komme til at sige to forskellige ting.
     3) FREMDRIFTSINDIKATOR i folio-linjen: kapitlets navn står der i forvejen
        (#folioSektion), og blokken føjer en hårfin 1 px streg og et lille
        "3 / 6" til i folioens egen sats. Det er bevidst næsten usynligt og
        må ikke gøres til en fed statusbjælke.
     4) STABILE HASH-LINKS PR. KAPITEL. #toemreren, #jord-og-beton,
        #opsigelsesvarsler osv. åbner decket på kapitlets første slide.
        Sluggen står ved hvert kapitel i listen, så den kan læses og sendes
        videre. DE GAMLE HASH-LINKS PR. SLIDENUMMER VIRKER UÆNDRET: #4 er
        stadig slide 4, og motoren skriver stadig selv #N i adressefeltet,
        så deep-link-testen i deck-lint.js er urørt.

     DESIGNSYSTEM v1.3. Ingen nye farver og ingen ny typografi: --gul #F8E965,
     --sort #111213, --tekst #26282B, --muted #71757C, --border #ECECE8,
     --flade #F6F6F3, --linje #C9C9C2, Inter 400-900. Reglen om maksimalt én
     gul flade pr. slide er ikke rørt — den gule streg i listen sidder på det
     AKTIVE kapitel i overlejringen, ikke på slidet, og overlejringen ligger
     oven på indholdet og tæller derfor ikke med.
     ============================================================================ -->

.kpos{font-size:11px;font-weight:800;letter-spacing:.14em;color:var(--linje);
  font-variant-numeric:tabular-nums}
.moerk-chrome .kmeter{background:rgba(255,255,255,.16)}
.moerk-chrome .kmeter i{background:rgba(255,255,255,.5)}
.moerk-chrome .kpos{color:rgba(255,255,255,.35)}
.gul-chrome .kmeter{background:rgba(17,18,19,.14)}
.gul-chrome .kmeter i{background:rgba(17,18,19,.42)}
.gul-chrome .kpos{color:rgba(17,18,19,.42)}
@media print{#kapitelmenu{display:none!important}.kmeter,.kpos{display:none}}
@media (prefers-reduced-motion:reduce){.kmeter i{transition:none}}
</style>
<script>
(function(){
  var alleSlides=[].slice.call(document.querySelectorAll('.slide'));
  if(!alleSlides.length)return;

  /* slug: dansk -> ascii, saa #toemreren og #jord-og-beton er stabile og kan skrives i hånden */
  function slug(s){
    return String(s).toLowerCase()
      .replace(/æ/g,'ae').replace(/ø/g,'oe').replace(/å/g,'aa')
      .replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
  }

  /* kapitlerne ER blokkene: sammenhaengende loeb af samme data-sektion */
  var kap=[];
  alleSlides.forEach(function(s,n){
    var navn=(s.dataset.sektion||'').trim();
    var sidste=kap[kap.length-1];
    if(sidste&&sidste.navn===navn){sidste.slut=n;return;}
    kap.push({navn:navn,slug:slug(navn),start:n,slut:n});
  });

  /* ---- fremdriftsindikator i folio-linjen: haarfin, ikke en statusbjaelke ---- */
  var folio=document.querySelector('.folio');
  var sekEl=document.getElementById('folioSektion');
  var meter=null,meterFyld=null,posEl=null;
  if(folio&&sekEl){
    meter=document.createElement('span');meter.className='kmeter';meter.setAttribute('aria-hidden','true');
    meterFyld=document.createElement('i');meter.appendChild(meterFyld);
    posEl=document.createElement('span');posEl.className='kpos';
    sekEl.parentNode.insertBefore(meter,sekEl.nextSibling);
    meter.parentNode.insertBefore(posEl,meter.nextSibling);
  }

  /* ---- kapitellisten. Lukket som udgangspunkt, saa den ikke kan komme med paa
         et screenshot og ikke kan forstyrre en optagelse. ---- */
  var menu=document.createElement('div');
  menu.id='kapitelmenu';menu.setAttribute('role','dialog');menu.setAttribute('aria-label','Kapitler');
  var panel=document.createElement('div');panel.className='kpanel';
  var hoved=document.createElement('div');hoved.className='khoved';
  var titel=document.createElement('span');titel.className='ktitel';titel.textContent='Kapitler';
  var deckNavn=document.createElement('span');deckNavn.className='kdeck';
  deckNavn.textContent=kap.length+' kapitler · '+alleSlides.length+' slides';
  hoved.appendChild(titel);hoved.appendChild(deckNavn);panel.appendChild(hoved);

  var raekker=kap.map(function(k,n){
    var r=document.createElement('button');r.type='button';r.className='krow';
    var num=document.createElement('span');num.className='knum';num.textContent=(n+1);
    var navn=document.createElement('span');navn.className='knavn';navn.textContent=k.navn;
    var hash=document.createElement('span');hash.className='khash';hash.textContent='#'+k.slug;
    var span=document.createElement('span');span.className='kspan';
    span.textContent=(k.start+1===k.slut+1)?('slide '+(k.start+1)):('slide '+(k.start+1)+'-'+(k.slut+1));
    r.appendChild(num);r.appendChild(navn);r.appendChild(hash);r.appendChild(span);
    r.addEventListener('click',function(){gaaTilKapitel(n);});
    panel.appendChild(r);
    return r;
  });

  var fod=document.createElement('div');fod.className='kfod';
  fod.textContent='1-9 spring · pil op og ned vælger · Enter åbner · Esc lukker · K åbner listen igen';
  panel.appendChild(fod);
  menu.appendChild(panel);
  menu.addEventListener('click',function(e){if(e.target===menu)luk();});
  document.body.appendChild(menu);

  var aaben=false,valgt=0;

  function kapitelFor(n){
    for(var x=0;x<kap.length;x++){if(n>=kap[x].start&&n<=kap[x].slut)return x;}
    return 0;
  }
  function markerValgt(){
    raekker.forEach(function(r,n){r.classList.toggle('valgt',n===valgt);});
  }
  function opdater(){
    var n=kapitelFor(i),k=kap[n],ial=k.slut-k.start+1,nu=i-k.start+1;
    if(meterFyld)meterFyld.style.width=(nu/ial*100)+'%';
    if(posEl)posEl.textContent=nu+' / '+ial;
    if(meter)meter.title=k.navn+' · '+nu+' af '+ial;
    raekker.forEach(function(r,x){r.classList.toggle('nu',x===n);});
  }
  function aab(){
    valgt=kapitelFor(i);markerValgt();aaben=true;menu.classList.add('aaben');
  }
  function luk(){aaben=false;menu.classList.remove('aaben');}
  function gaaTilKapitel(n){
    luk();
    vis(kap[Math.max(0,Math.min(kap.length-1,n))].start);
  }

  /* ---- hash: baade #12 (slidenummer, uaendret) og #toemreren (kapitel) ----
     VIGTIGT: motoren har allerede kaldt vis() og skrevet #N i adressefeltet, før
     denne blok koerer. Det ORIGINALE fragment fra selve navigationen hentes
     derfor fra PerformanceNavigationTiming, som beholder det. Uden det ville et
     kapitel-link altid lande paa slide 1. */
  function fragmentVedIndlaesning(){
    var e=performance.getEntriesByType?performance.getEntriesByType('navigation')[0]:null;
    var raa=(e&&e.name)?e.name:location.href;
    var n=raa.indexOf('#');
    return n<0?'':raa.slice(n+1);
  }
  function losHash(raa){
    var h='';
    try{h=decodeURIComponent(String(raa||'')).trim();}catch(x){h=String(raa||'').trim();}
    if(!h)return false;
    if(/^\d+$/.test(h)){vis(parseInt(h,10)-1);return true;}
    var s=slug(h);
    for(var x2=0;x2<kap.length;x2++){
      if(kap[x2].slug===s){vis(kap[x2].start);return true;}
    }
    return false;
  }

  /* motoren skal blive ved med at skrive #N, saa deep-link pr. slide er urørt.
     Her lægges kun opdateringen af fremdriftsindikatoren oven på. */
  var motorVis=window.vis;
  window.vis=function(n){motorVis(n);opdater();};

  addEventListener('hashchange',function(){losHash(String(location.hash||'').slice(1));});

  addEventListener('keydown',function(e){
    if(e.metaKey||e.ctrlKey||e.altKey)return;
    var t=e.key;
    if(!aaben){
      if(t==='k'||t==='K'||t==='m'||t==='M'){e.preventDefault();e.stopPropagation();aab();}
      return;
    }
    e.preventDefault();e.stopPropagation();
    if(t==='Escape'||t==='k'||t==='K'||t==='m'||t==='M'){luk();return;}
    if(t==='ArrowDown'||t==='ArrowRight'){valgt=Math.min(kap.length-1,valgt+1);markerValgt();return;}
    if(t==='ArrowUp'||t==='ArrowLeft'){valgt=Math.max(0,valgt-1);markerValgt();return;}
    if(t==='Enter'||t===' '){gaaTilKapitel(valgt);return;}
    if(/^[1-9]$/.test(t)){var n=parseInt(t,10)-1;if(n<kap.length)gaaTilKapitel(n);return;}
  },true);

  var start=fragmentVedIndlaesning();
  if(!(start&&!/^\d+$/.test(start)&&losHash(start)))opdater();
})();
</script>
</body>
</html>
