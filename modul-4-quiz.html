<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modul 4 · Quiz · Byggebranchen · PowerMatch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --gul:#F8E965; --gul-soft:#FDF8D4; --gul-kant:#F0E4A0;
  --sort:#111213; --tekst:#26282B; --muted:#71757C;
  --border:#ECECE8; --flade:#F6F6F3; --bg:#FFFFFF;
  --groen:#2E7D32; --roed:#C62828;
  --ease:cubic-bezier(.22,1,.36,1);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',-apple-system,Arial,sans-serif;color:var(--tekst);background:var(--bg);-webkit-font-smoothing:antialiased;min-height:100vh}
b{color:var(--sort)}

.top{position:sticky;top:0;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);z-index:10}
.top-inner{max-width:860px;margin:0 auto;padding:18px 28px;display:flex;align-items:center;gap:14px}
.top img{width:26px;height:26px}
.top .navn{font-weight:800;font-size:14px;color:var(--sort)}
.top .sep{color:#C9C9C2}
.top .titel{font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.top .tilbage{margin-left:auto;font-size:13px;font-weight:700;color:var(--sort);text-decoration:none;border:1.5px solid var(--border);border-radius:100px;padding:7px 15px;white-space:nowrap}
.top .taeller{font-size:14px;font-weight:900;color:var(--sort);font-variant-numeric:tabular-nums}
.top .taeller span{color:#C9C9C2}
.pbar{height:3px;background:var(--flade)}
.pbar i{display:block;height:100%;width:0;background:var(--gul);transition:width .4s var(--ease)}

.wrap{max-width:860px;margin:0 auto;padding:54px 28px 90px}
.kicker{display:flex;align-items:center;gap:14px;margin-bottom:22px}
.kicker .knr{font-size:14px;font-weight:900;color:var(--sort);font-variant-numeric:tabular-nums}
.kicker .krule{width:40px;height:2px;background:var(--gul)}
.kicker .ktxt{font-size:11px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
h2{font-size:clamp(24px,3.2vw,34px);font-weight:900;color:var(--sort);letter-spacing:-.02em;line-height:1.18;margin-bottom:34px}

.opt{
  display:flex;align-items:baseline;gap:18px;width:100%;text-align:left;cursor:pointer;
  background:none;border:none;border-top:1px solid var(--border);padding:20px 6px;
  font-family:inherit;font-size:16.5px;font-weight:600;color:var(--tekst);line-height:1.5;
  transition:background .15s ease;
}
.opt:last-of-type{border-bottom:1px solid var(--border)}
.opt:hover:not(:disabled){background:var(--flade)}
.opt .bogstav{
  flex-shrink:0;width:32px;height:32px;border-radius:10px;background:var(--flade);
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:var(--sort);
  position:relative;top:6px;
}
.opt.rigtig{background:var(--gul-soft)}
.opt.rigtig .bogstav{background:var(--gul)}
.opt.forkert{opacity:.55}
.opt.forkert .bogstav{background:#FBE9E7;color:var(--roed)}
.opt:disabled{cursor:default}

.forklaring{
  margin-top:26px;border-left:3px solid var(--gul);padding:4px 0 4px 22px;
  font-size:15px;line-height:1.65;color:var(--muted);display:none;
}
.forklaring.vis{display:block}
.forklaring .dom{font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;display:block;margin-bottom:6px}
.forklaring .dom.ok{color:var(--groen)}
.forklaring .dom.fejl{color:var(--roed)}

.naeste{
  margin-top:34px;background:var(--sort);color:#fff;font-weight:800;font-size:15px;
  padding:15px 34px;border-radius:100px;border:none;cursor:pointer;font-family:inherit;display:none;
}
.naeste.vis{display:inline-block}
.naeste:hover{transform:translateY(-1px)}

/* resultat */
.resultat{text-align:center;padding-top:6vh;display:none}
.resultat.vis{display:block}
.resultat .kaempe{font-size:clamp(90px,16vw,190px);font-weight:900;letter-spacing:-.05em;line-height:1;color:var(--sort)}
.resultat .kaempe .mk{background:linear-gradient(transparent 66%, var(--gul) 66%, var(--gul) 96%, transparent 96%);padding:0 10px}
.resultat h3{font-size:clamp(24px,3vw,34px);font-weight:900;color:var(--sort);letter-spacing:-.02em;margin:30px 0 12px}
.resultat p{font-size:16px;color:var(--muted);max-width:52ch;margin:0 auto;line-height:1.65}
.resultat .naeste{display:inline-block;margin-top:36px}
.gennemgang{max-width:640px;margin:44px auto 0;text-align:left}
.g-row{display:flex;gap:14px;align-items:baseline;border-top:1px solid var(--border);padding:14px 4px;font-size:14px;color:var(--muted)}
.g-row b{font-weight:800}
.g-row .ik{flex-shrink:0;font-weight:900}
.g-row .ik.ok{color:var(--groen)}
.g-row .ik.fejl{color:var(--roed)}

footer{border-top:1px solid var(--border);padding:18px 28px;display:flex;align-items:center;gap:10px;max-width:860px;margin:0 auto;font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
footer img{width:20px;height:20px}
</style>
</head>

let idx=0, score=0, svar=[];
const quizEl=document.getElementById('quiz');

function visSpg(){
  const s=SPG[idx];
  document.getElementById('taeller').innerHTML=(idx+1)+' <span>/ '+SPG.length+'</span>';
  document.getElementById('pbar').style.width=(idx/SPG.length*100)+'%';
  quizEl.innerHTML=`
    <div class="kicker"><span class="knr">${String(idx+1).padStart(2,'0')}</span><span class="krule"></span><span class="ktxt">${s.t}</span></div>
    <h2>${s.q}</h2>
    ${s.opts.map((o,k)=>`<button class="opt" onclick="vaelg(${k})"><span class="bogstav">${'ABCD'[k]}</span><span>${o}</span></button>`).join('')}
    <div class="forklaring" id="fk"><span class="dom" id="dom"></span>${s.fk}</div>
    <button class="naeste" id="naeste" onclick="næste()">${idx===SPG.length-1?'Se dit resultat →':'Næste spørgsmål →'}</button>
  `;
}
function vaelg(k){
  const s=SPG[idx];
  const opts=[...document.querySelectorAll('.opt')];
  opts.forEach((o,i)=>{o.disabled=true; if(i===s.rigtig)o.classList.add('rigtig'); else if(i===k)o.classList.add('forkert');});
  const ok=(k===s.rigtig);
  if(ok)score++;
  svar.push(ok);
  const dom=document.getElementById('dom');
  dom.textContent=ok?'Rigtigt':'Forkert. Det rigtige svar er markeret';
  dom.className='dom '+(ok?'ok':'fejl');
  document.getElementById('fk').classList.add('vis');
  document.getElementById('naeste').classList.add('vis');
}
function næste(){
  idx++;
  if(idx<SPG.length){visSpg();scrollTo(0,0)}
  else visResultat();
}
function visResultat(){
  document.getElementById('pbar').style.width='100%';
  quizEl.style.display='none';
  const r=document.getElementById('resultat');
  r.classList.add('vis');
  document.getElementById('scoreTal').textContent=score+'/'+SPG.length;
  const bestaaet=score>=16;
  document.getElementById('scoreTitel').textContent=bestaaet?'Bestået. Du kan tale med en mester.':'Ikke bestået endnu. Se videoerne igen.';
  document.getElementById('scoreTekst').textContent=bestaaet
    ?'Du kan fagene, hovedopgaverne og de spørgsmål der får mesteren i snak. Tag videoerne igen inden din første uge i telefonen. Især fagblokkene, for de sidder først efter tredje gennemsyn.'
    :'Du skal have mindst 16 rigtige ud af 20. Gense især hovedopgaverne fag for fag og de spørgsmål du stiller mesteren, når han nævner en opgave. Det er dem, der bærer dine første hundrede dialoger.';
  document.getElementById('gennemgang').innerHTML=svar.map((ok,i)=>
    `<div class="g-row"><span class="ik ${ok?'ok':'fejl'}">${ok?'✓':'✗'}</span><span><b>${String(i+1).padStart(2,'0')}</b> · ${SPG[i].q}</span></div>`
  ).join('');
  scrollTo(0,0);
}
visSpg();
</script>
